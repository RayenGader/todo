<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>To do - job hunt</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #090d15; --surface: #111827; --surface-2: #161f31; --surface-3: #1c2740;
    --line: rgba(148, 163, 184, .12); --line-2: rgba(148, 163, 184, .24);
    --text: #e8ecf4; --muted: #97a3b8; --faint: #66728a;
    --accent: #7c9cff; --accent-2: #a78bfa; --ok: #34d399;
    --today: #fb7185; --week: #fbbf24; --later: #64748b;
    --c-answer: #fb7185; --c-security: #fbbf24; --c-apply: #60a5fa; --c-linkedin: #38bdf8;
    --c-portal: #c084fc; --c-decide: #34d399; --c-grow: #94a3b8;
    --radius: 16px;
    --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; min-height: 100vh; color: var(--text); font: 15px/1.55 var(--font);
    background:
      radial-gradient(900px 420px at 12% -8%, rgba(124, 156, 255, .16), transparent 60%),
      radial-gradient(700px 380px at 95% -5%, rgba(167, 139, 250, .12), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  a { color: var(--accent); }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* top bar */
  .bar { position: sticky; top: 0; z-index: 5; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
         background: rgba(9, 13, 21, .72); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 920px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: none;
          background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #0b1020; }
  .logo svg.i { width: 18px; height: 18px; stroke-width: 3; }
  .brand b { font-size: 16px; letter-spacing: -.01em; }
  .stamp { color: var(--faint); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-links { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .pill-link { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
               border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--muted);
               text-decoration: none; font-size: 13px; white-space: nowrap; cursor: pointer; }
  .pill-link:hover { color: var(--text); border-color: var(--line-2); }
  .pill-link svg.i { width: 15px; height: 15px; }
  #reload.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .wrap { max-width: 920px; margin: 0 auto; padding: 22px 16px 80px; }

  /* hero */
  .hero { display: flex; gap: 20px; align-items: center; justify-content: space-between;
          padding: 22px 24px; border-radius: 20px; border: 1px solid var(--line);
          background: linear-gradient(135deg, rgba(124, 156, 255, .10), rgba(167, 139, 250, .05) 45%, rgba(255, 255, 255, .02)); }
  .hero h1 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; font-weight: 650; }
  .hero p { margin: 6px 0 0; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .stat { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; font-size: 13px;
          background: rgba(255, 255, 255, .04); border: 1px solid var(--line); color: var(--muted); }
  .stat b { color: var(--text); font-weight: 650; }
  .stat svg.i { width: 15px; height: 15px; color: var(--accent); }
  .stats-label { width: 100%; font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { width: 104px; height: 104px; transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.1; }
  .ring .num b { font-size: 22px; font-weight: 700; }
  .ring .num span { display: block; font-size: 11px; color: var(--muted); }
  .ring circle { fill: none; stroke-width: 9; stroke-linecap: round; }
  .ring .track { stroke: rgba(148, 163, 184, .14); }
  .ring .prog { stroke: url(#grad); transition: stroke-dashoffset .6s ease; }

  .banner { margin-top: 14px; padding: 11px 14px; border-radius: 12px; font-size: 14px; border: 1px solid var(--line);
            background: var(--surface); color: var(--muted); }
  .banner.warn { border-color: rgba(251, 191, 36, .4); }

  /* toolbar */
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 22px 0 10px; flex-wrap: wrap; }
  .tabs { display: inline-flex; padding: 4px; gap: 2px; border-radius: 12px; background: var(--surface);
          border: 1px solid var(--line); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { border: 0; background: transparent; padding: 7px 12px; border-radius: 9px; cursor: pointer; color: var(--muted);
         font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
  .tab:hover { color: var(--text); }
  .tab[aria-pressed="true"] { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset; }
  .tab .n { font-size: 12px; padding: 0 7px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--muted); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; }
  .search { margin-left: auto; position: relative; flex: 1 1 220px; max-width: 300px; }
  .search svg.i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
  .search input { width: 100%; padding: 9px 12px 9px 34px; border-radius: 12px; border: 1px solid var(--line);
                  background: var(--surface); color: var(--text); font: inherit; font-size: 14px; }
  .search input::placeholder { color: var(--faint); }
  .search input:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; cursor: pointer;
          border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .chip svg.i { width: 14px; height: 14px; color: var(--c); }
  .chip:hover { color: var(--text); border-color: var(--line-2); }
  .chip[aria-pressed="true"] { color: var(--text); background: rgba(255, 255, 255, .06); border-color: var(--line-2); }
  .chip .n { color: var(--faint); font-size: 12px; }

  /* groups */
  .group { margin-top: 18px; }
  .group-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 4px; background: none;
                border: 0; cursor: pointer; text-align: left; }
  .group-head h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
  .group-head .dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
  .group-head .count { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, .06); color: var(--muted); }
  .group-head .hint { color: var(--faint); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .group-head .chev { margin-left: auto; color: var(--faint); transition: transform .2s; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .cards { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 6px; }
  .group, .card, #list, #bottom { min-width: 0; }

  /* card */
  .card { position: relative; display: flex; gap: 14px; padding: 15px 16px 15px 18px; border-radius: var(--radius);
          background: linear-gradient(180deg, rgba(255, 255, 255, .035), rgba(255, 255, 255, .015)), var(--surface);
          border: 1px solid var(--line); transition: border-color .15s, transform .15s, opacity .25s, max-height .3s; }
  .card::before { content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 3px; border-radius: 0 3px 3px 0;
                  background: var(--c); opacity: .9; }
  .card:hover { border-color: var(--line-2); }
  .card.first { border-color: rgba(124, 156, 255, .45); box-shadow: 0 0 0 1px rgba(124, 156, 255, .15), 0 10px 30px -12px rgba(124, 156, 255, .35); }
  .card.leaving { opacity: 0; transform: translateX(24px) scale(.98); }
  .check { flex: none; width: 26px; height: 26px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--line-2);
           background: transparent; cursor: pointer; display: grid; place-items: center; color: transparent; padding: 0;
           transition: all .15s; }
  .check svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .check:hover { border-color: var(--ok); color: var(--ok); background: rgba(52, 211, 153, .08); }
  .check.done { background: var(--ok); border-color: var(--ok); color: #06231a; }
  .main { flex: 1; min-width: 0; }
  .top { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
  .ticon { flex: none; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
           color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .ttl { flex: 1; min-width: 0; }
  .ttl h3 { margin: 0; font-size: 15.5px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin-top: 3px; font-size: 12.5px; color: var(--faint); }
  .meta .kind { color: var(--c); font-weight: 600; }
  .meta .sep { opacity: .5; }
  .sub { margin-top: 2px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: #0b1020;
           background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .top .chev { color: var(--faint); margin-top: 6px; transition: transform .2s; }
  .card.open .top .chev { transform: rotate(180deg); }
  .quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-left: 46px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 7px 13px; border-radius: 10px; font-size: 13.5px;
         border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); color: var(--text); text-decoration: none;
         cursor: pointer; white-space: nowrap; transition: all .15s; }
  .btn svg.i { width: 15px; height: 15px; }
  .btn:hover { border-color: rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .06); }
  .btn.primary { border: 0; color: #0b1020; font-weight: 600; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.good { border-color: rgba(52, 211, 153, .45); color: var(--ok); }
  .btn.good:hover { background: rgba(52, 211, 153, .1); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--text); background: rgba(255, 255, 255, .05); }
  .more { display: none; margin-top: 12px; padding-left: 46px; }
  .card.open .more { display: block; }
  .detail { margin: 0; font-size: 14px; color: #c9d1de; overflow-wrap: anywhere; white-space: pre-line; }
  .note { margin-top: 10px; display: flex; gap: 9px; padding: 9px 12px; border-radius: 10px; font-size: 13.5px;
          background: rgba(251, 191, 36, .07); border: 1px solid rgba(251, 191, 36, .22); color: #f5dfa8; }
  .note svg.i { color: var(--week); width: 16px; height: 16px; margin-top: 2px; }
  ol.steps { margin: 10px 0 0; padding-left: 20px; font-size: 14px; color: #c9d1de; }
  ol.steps li { margin: 3px 0; }
  .quote { margin-top: 12px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--surface-2); overflow: hidden; }
  .quote-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px 7px 12px;
                border-bottom: 1px solid var(--line); font-size: 12px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
  .quote-body { padding: 11px 13px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .foot .src { font-size: 12px; color: var(--faint); margin-right: auto; }

  /* bottom boxes */
  details.box { margin-top: 22px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
  details.box > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 10px;
                          font-weight: 600; }
  details.box > summary::-webkit-details-marker { display: none; }
  details.box > summary .chev { margin-left: auto; color: var(--faint); transition: transform .2s; transform: rotate(-90deg); }
  details.box[open] > summary .chev { transform: none; }
  details.box > summary svg.lead { color: var(--ok); }
  .box-body { padding: 0 16px 12px; }
  .box-body .cards { margin-top: 0; }
  .done-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .done-row:first-child { border-top: 0; }
  .done-row .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none;
                    background: rgba(52, 211, 153, .15); color: var(--ok); }
  .done-row .mark svg.i { width: 13px; height: 13px; stroke-width: 3; }
  .done-row.no .mark { background: rgba(148, 163, 184, .12); color: var(--faint); }
  .done-row .t { flex: 1; min-width: 0; color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(148, 163, 184, .4);
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .done-row .when { font-size: 12px; color: var(--faint); white-space: nowrap; }

  .empty { text-align: center; padding: 48px 16px; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 20px; margin-top: 18px; }
  .empty .big { font-size: 40px; }
  .empty h3 { margin: 8px 0 4px; color: var(--text); }
  .keys { margin-top: 26px; text-align: center; color: var(--faint); font-size: 12px; }
  kbd { font: 11px var(--font); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); background: var(--surface); }

  /* toast */
  #toast { position: fixed; left: 50%; bottom: 22px; z-index: 9; display: flex; align-items: center; gap: 12px;
           transform: translate(-50%, 24px); opacity: 0; pointer-events: none; transition: all .22s;
           padding: 10px 10px 10px 16px; border-radius: 14px; background: #1f2a44; border: 1px solid var(--line-2);
           box-shadow: 0 16px 40px -12px rgba(0, 0, 0, .7); font-size: 14px; max-width: calc(100% - 32px); }
  #toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
  #toast button { border: 0; background: rgba(124, 156, 255, .16); color: var(--accent); font-weight: 600; padding: 6px 12px;
                  border-radius: 9px; cursor: pointer; }
  #toast button[hidden] { display: none; }

  /* sign-in (the web copy) */
  body.locked .bar, body.locked main { display: none; }
  body:not(.web) .web-only, body.web .local-only { display: none !important; }
  #gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  #gate[hidden] { display: none; }
  .gate-card { width: 100%; max-width: 380px; padding: 30px 26px 24px; border-radius: 22px; border: 1px solid var(--line-2);
               background: linear-gradient(180deg, rgba(255, 255, 255, .05), rgba(255, 255, 255, .02)), var(--surface);
               box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .8), 0 0 0 1px rgba(124, 156, 255, .08); }
  .gate-card .logo { width: 48px; height: 48px; border-radius: 14px; margin-bottom: 16px; }
  .gate-card .logo svg.i { width: 26px; height: 26px; }
  .gate-card h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
  .gate-card > p { margin: 6px 0 20px; color: var(--muted); font-size: 14px; }
  .field { display: block; margin-bottom: 14px; font-size: 13px; color: var(--muted); }
  .field input { display: block; width: 100%; margin-top: 6px; padding: 11px 13px; border-radius: 12px; font: inherit;
                 font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--line-2); }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 156, 255, .18); }
  .remember { display: flex; align-items: center; gap: 9px; margin: 4px 0 18px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .remember input { width: 17px; height: 17px; accent-color: var(--accent); }
  .gate-card .btn.primary { width: 100%; justify-content: center; padding: 12px; font-size: 15px; border-radius: 12px; }
  .gate-card .btn.primary[disabled] { opacity: .7; cursor: wait; }
  .gate-err { min-height: 20px; margin: 12px 0 0; font-size: 13.5px; color: var(--today); text-align: center; }
  .gate-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint);
               display: flex; gap: 8px; align-items: center; }
  .gate-foot svg.i { width: 14px; height: 14px; color: var(--ok); }

  @media (max-width: 640px) {
    .bar-links .pill-link span { display: none; }
    .stamp { display: none; }
    .hero { padding: 18px; flex-direction: column-reverse; align-items: flex-start; }
    .hero h1 { font-size: 22px; }
    .ring { width: 84px; height: 84px; } .ring svg { width: 84px; height: 84px; }
    .search { max-width: none; margin-left: 0; flex-basis: 100%; }
    .card { padding: 13px 12px 13px 15px; gap: 10px; }
    .ticon { display: none; }
    .quick, .more { padding-left: 0; }
    .group-head .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="gate" hidden>
  <form class="gate-card" id="gate-form" autocomplete="on">
    <span class="logo"><span data-icon="check"></span></span>
    <h1>Job hunt &middot; To do</h1>
    <p>Private page. Sign in to unlock your list.</p>
    <label class="field">Username
      <input id="gate-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field">Password
      <input id="gate-pass" name="password" type="password" autocomplete="current-password" required></label>
    <label class="remember"><input id="gate-keep" type="checkbox" checked> Stay signed in on this device</label>
    <button class="btn primary" id="gate-go" type="submit">Unlock</button>
    <p class="gate-err" id="gate-err" role="alert"></p>
    <div class="gate-foot"><span data-icon="security"></span>
      <span>The list is encrypted. It opens in your browser, only with your username and password.</span></div>
  </form>
</div>
<header class="bar">
  <div class="bar-in">
    <div class="brand">
      <span class="logo"><span data-icon="check"></span></span>
      <b>To do</b>
      <span class="stamp" id="stamp"></span>
    </div>
    <nav class="bar-links">
      <button class="pill-link" id="reload" type="button" title="Refresh (R)"><span data-icon="refresh"></span><span>Refresh</span></button>
      <a class="pill-link local-only" href="http://127.0.0.1:8765/" target="_blank" rel="noopener" title="Job board"><span data-icon="apply"></span><span>Job board</span></a>
      <a class="pill-link local-only" href="http://127.0.0.1:8766/" target="_blank" rel="noopener" title="LinkedIn Agent"><span data-icon="linkedin"></span><span>LinkedIn Agent</span></a>
      <a class="pill-link local-only" href="http://127.0.0.1:8765/tracks" target="_blank" rel="noopener" title="France / Tunis tracks"><span data-icon="portal"></span><span>Tracks</span></a>
      <button class="pill-link web-only" id="signout" type="button" title="Sign out on this device"><span data-icon="logout"></span><span>Sign out</span></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1 id="hello"></h1>
      <p id="summary"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="ring" id="ring" aria-label="Progress today"></div>
  </section>
  <div id="banners"></div>
  <div class="toolbar">
    <div class="tabs" id="tabs" role="toolbar" aria-label="When"></div>
    <label class="search"><span data-icon="search"></span>
      <input id="q" type="search" placeholder="Search a name, a company..." autocomplete="off" aria-label="Search"></label>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Kind"></div>
  <div id="list"></div>
  <div id="bottom"></div>
  <p class="keys"><kbd>/</kbd> search &nbsp; <kbd>R</kbd> refresh &nbsp; Click a card to see the details.</p>
</main>

function store(key, value) {
  try {
    if (value === undefined) return JSON.parse(localStorage.getItem(key) || "null");
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { return null; }
}
function saveUi() { store("todo-ui", {prio: ui.prio, type: ui.type, collapsed: ui.collapsed}); }
function icon(name, cls) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "i" + (cls ? " " + cls : ""));
  s.setAttribute("aria-hidden", "true"); s.innerHTML = ICONS[name] || ""; return s;
}
document.querySelectorAll("[data-icon]").forEach(e => e.replaceWith(icon(e.dataset.icon)));

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.setAttribute("style", v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const $ = s => document.querySelector(s);
function safeUrl(u) { return /^(https?:|file:|mailto:)/i.test(u || "") ? u : "#"; }
function ago(iso) {
  if (!iso) return "";
  const t = new Date(iso).getTime(); if (isNaN(t)) return "";
  const h = (Date.now() - t) / 36e5;
  if (h < 1) return "just now";
  if (h < 24 && new Date(iso).toDateString() === new Date().toDateString()) return "today";
  const days = Math.max(1, Math.round(h / 24));
  return days === 1 ? "yesterday" : days + " days ago";
}
function clock(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const same = d.toDateString() === new Date().toDateString();
  return (same ? "today" : d.toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short"})) +
         " " + d.toLocaleTimeString("en-GB", {hour: "2-digit", minute: "2-digit"});
}
let toastTimer;
function toast(text, undo) {
  const t = $("#toast"), b = $("#toast-undo");
  $("#toast-text").textContent = text;
  b.hidden = !undo; b.onclick = () => { t.classList.remove("show"); undo && undo(); };
  t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), undo ? 6000 : 2400);
}
async function api(path, body) {
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: {"X-Job-Agent": "1", "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

// a copy opened from disk keeps its ticks in this browser only
function view() {
  if (LIVE) return D;
  const marks = store("todo-marks") || {}, now = Date.now();
  const items = [], snoozed = D.snoozed.slice(), done = D.done.slice();
  for (const it of D.items) {
    const m = marks[it.key];
    if (!m) items.push(it);
    else if (m.state === "later" && new Date(m.until).getTime() > now) snoozed.push(Object.assign({}, it, {until: m.until}));
    else if (m.state === "later") items.push(it);
    else done.unshift(Object.assign({}, it, {state: m.state, at: m.at}));
  }
  const counts = Object.assign({}, D.counts, {today: 0, week: 0, later: 0, snoozed: snoozed.length, done: done.length});
  items.forEach(it => counts[it.prio] = (counts[it.prio] || 0) + 1);
  return Object.assign({}, D, {items, snoozed, done, counts});
}

const WORDS = {done: "Done - well played", dismissed: "Removed from your list", later: "Hidden for two days", open: "Back on your list"};
async function mark(item, state, card, quiet) {
  if (card) { card.classList.add("leaving"); await new Promise(r => setTimeout(r, 230)); }
  const undo = state === "open" ? null : () => mark(item, "open");
  if (!LIVE) {
    const marks = store("todo-marks") || {};
    if (state === "open") delete marks[item.key];
    else marks[item.key] = {state, at: new Date().toISOString(), until: new Date(Date.now() + 2 * 864e5).toISOString()};
    store("todo-marks", marks);
    render(); if (!quiet) toast(WORDS[state] + (ENC ? "" : " (this browser only)"), undo);
    return;
  }
  try {
    D = await api("/api/todo", {key: item.key, state, title: item.title});
    render(); if (!quiet) toast(WORDS[state], undo);
  } catch (e) {
    if (card) card.classList.remove("leaving");
    toast("Not saved - is the job agent's window open?");
  }
}
async function act(item, action, card) {
  if (!LIVE) { toast("Open the live page, http://127.0.0.1:8765/todo, for this button"); return; }
  try {
    const r = await api(action.post, {});
    if (r && r.ok === false) throw new Error(r.error || "refused");
    await mark(item, "done", card, true);
    toast(action.toast || "Done");
  } catch (e) { toast("That did not work: " + e.message); }
}
function copyText(text, btn) {
  const ok = () => {
    toast("Copied - paste it with Ctrl+V");
    if (btn) { const old = btn.lastChild.textContent; btn.lastChild.textContent = "Copied"; btn.classList.add("good");
               setTimeout(() => { btn.lastChild.textContent = old; }, 1800); }
  };
  const fallback = () => {
    const ta = el("textarea", {style: "position:fixed;left:-9999px"}); ta.value = text; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { toast("Select the text and copy it"); }
    ta.remove();
  };
  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(ok, fallback);
  else fallback();
}

function ring(done, total) {
  const r = 40, C = 2 * Math.PI * r, frac = total ? done / total : 0;
  const box = $("#ring"); box.textContent = "";
  box.innerHTML = `<svg viewBox="0 0 100 100"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7c9cff"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
    <circle class="track" cx="50" cy="50" r="${r}"/>
    <circle class="prog" cx="50" cy="50" r="${r}" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - frac)}"/></svg>`;
  box.append(el("div", {class: "num"}, el("div", {}, el("b", {}, total ? `${done}/${total}` : "✓"),
                                                  el("span", {}, total ? "done today" : "all clear"))));
}

function header(data) {
  const h = new Date().getHours();
  $("#hello").textContent = (h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening") + ", Rayen";
  const c = data.counts;
  $("#summary").textContent = c.today
    ? `${c.today} thing${c.today > 1 ? "s" : ""} for today, ${c.week || 0} this week. Start with the first card.`
    : c.week ? `Nothing urgent today. ${c.week} thing${c.week > 1 ? "s" : ""} this week.`
    : "Nothing waiting for you. The tools keep working.";
  const isToday = iso => iso && new Date(iso).toDateString() === new Date().toDateString();
  const doneToday = data.done.filter(d => (d.state === "done") && isToday(d.at)).length;
  ring(doneToday, (c.today || 0) + doneToday);
  const a = data.activity || {};
  const stats = $("#stats"); stats.textContent = "";
  const bits = [["invite", a.invites, "invitations sent"], ["accepted", a.accepted, "accepted"],
                ["send", a.cv_messages, "CV messages"], ["mail", a.emails, "emails sent"], ["eye", a.postings, "postings read"]]
               .filter(b => b[1]);
  if (bits.length) {
    stats.append(el("div", {class: "stats-label"}, "Done for you in the last 24 hours"));
    bits.forEach(b => stats.append(el("span", {class: "stat"}, icon(b[0]), el("b", {}, b[1]), b[2])));
  }
  $("#stamp").textContent = "updated " + clock(data.generated) + (data.inbox_checked ? " · Gmail " + clock(data.inbox_checked) : "");
  const banners = $("#banners"); banners.textContent = "";
  if (ENC) banners.append(el("div", {class: "banner"}, "Updated by your PC " + clock(data.generated) +
    ". Ticks made here stay on this device."));
  else if (!LIVE) banners.append(el("div", {class: "banner"}, "This is the copy saved " + clock(data.generated) +
    ". The live page, which updates itself and keeps your ticks, is ",
    el("a", {href: "http://127.0.0.1:8765/todo"}, "127.0.0.1:8765/todo"), " (while the job agent's window is open)."));
  if (data.errors && data.errors.length) banners.append(el("div", {class: "banner warn"},
    "Some sources could not be read this time: " + data.errors.join(" | ")));
}

function filters(data) {
  const tabs = $("#tabs"); tabs.textContent = "";
  const tab = (id, label, n, color) => el("button", {class: "tab", type: "button", "aria-pressed": String(ui.prio === id),
      onclick: () => { ui.prio = id; saveUi(); render(); }},
    color ? el("span", {class: "dot", style: "background:" + color}) : null, label, el("span", {class: "n"}, n));
  tabs.append(tab("all", "All", data.items.length));
  PRIOS.forEach(p => tabs.append(tab(p.id, p.label, data.counts[p.id] || 0, p.color)));
  const chips = $("#chips"); chips.textContent = "";
  const per = {}; data.items.forEach(it => per[it.type] = (per[it.type] || 0) + 1);
  const chip = (id, label, n) => el("button", {class: "chip", type: "button", "aria-pressed": String(ui.type === id),
      style: id === "all" ? "" : `--c: var(--c-${id})`, onclick: () => { ui.type = ui.type === id ? "all" : id; saveUi(); render(); }},
    id === "all" ? null : icon(id), label, n !== undefined ? el("span", {class: "n"}, n) : null);
  chips.append(chip("all", "Every kind"));
  Object.keys(TYPES).forEach(t => per[t] && chips.append(chip(t, TYPES[t], per[t])));
}

function render() {
  const data = view();
  header(data); filters(data);
  const list = $("#list"); list.textContent = "";
  const q = query.trim().toLowerCase();
  const match = it => (ui.type === "all" || it.type === ui.type) &&
    (!q || [it.title, it.sub, it.detail, it.source, it.note].join(" ").toLowerCase().includes(q));
  let shown = 0;
  for (const p of PRIOS) {
    if (ui.prio !== "all" && ui.prio !== p.id) continue;
    const rows = data.items.filter(it => it.prio === p.id && match(it));
    if (!rows.length) continue;
    shown += rows.length;
    const collapsed = ui.prio === "all" && !q && ui.collapsed[p.id];
    list.append(el("section", {class: "group" + (collapsed ? " collapsed" : "")},
      el("button", {class: "group-head", type: "button", "aria-expanded": String(!collapsed),
                    onclick: () => { ui.collapsed[p.id] = !collapsed; saveUi(); render(); }},
        el("span", {class: "dot", style: `background:${p.color};color:${p.color}`}), el("h2", {}, p.label),
        el("span", {class: "count"}, rows.length), el("span", {class: "hint"}, p.hint), icon("chev", "chev")),
      collapsed ? null : el("div", {class: "cards"},
        rows.map((it, i) => card(it, p.id === "today" && i === 0 && !q && ui.type === "all")))));
  }
  if (!shown) list.append(el("div", {class: "empty"}, el("div", {class: "big"}, data.items.length ? "\u{1F50E}" : "\u{1F389}"),
    el("h3", {}, data.items.length ? "Nothing here" : "All clear"),
    el("p", {}, data.items.length ? "Nothing matches this filter or search." : "Nothing is waiting for you. The tools keep working - come back later.")));
  const bottom = $("#bottom"); bottom.textContent = "";
  if (data.snoozed.length) bottom.append(el("details", {class: "box"},
    el("summary", {}, icon("clock", "lead"), "Hidden for now", el("span", {class: "count"}, " (" + data.snoozed.length + ")"), icon("chev", "chev")),
    el("div", {class: "box-body"}, el("div", {class: "cards"}, data.snoozed.map(it => card(it, false))))));
  if (data.done.length) bottom.append(el("details", {class: "box"},
    el("summary", {}, icon("accepted", "lead"), "Done in the last two weeks", el("span", {class: "count"}, " (" + data.done.length + ")"), icon("chev", "chev")),
    el("div", {class: "box-body"}, data.done.map(it => el("div", {class: "done-row" + (it.state === "dismissed" ? " no" : "")},
      el("span", {class: "mark"}, icon(it.state === "dismissed" ? "x" : "check")),
      el("span", {class: "t", title: it.title}, it.title),
      el("span", {class: "when"}, it.state === "auto" ? "seen done by the tools" : it.state === "dismissed" ? "not doing" : clock(it.at)),
      it.state !== "auto" ? el("button", {class: "btn ghost", type: "button", onclick: () => mark(it, "open")}, icon("undo"), "Undo") : null)))));
}

async function reload(manual) {
  if (!LIVE) { if (manual) location.reload(); return; }
  const b = $("#reload"); if (manual) b.classList.add("spin");
  try { D = await api("/api/todo"); render(); if (manual) toast("Up to date"); }
  catch (e) { if (manual) toast("The job agent does not answer - is its window open?"); }
  finally { b.classList.remove("spin"); }
}
$("#reload").addEventListener("click", () => reload(true));
$("#q").addEventListener("input", e => { query = e.target.value; render(); });
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) { if (e.key === "Escape") { e.target.value = ""; query = ""; render(); e.target.blur(); } return; }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "r" || e.key === "R") reload(true);
});
setInterval(() => { if (!document.hidden) reload(false); }, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) reload(false); });

// ---- the web copy: sign in, decrypt in the browser, optionally keep the key on this device
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("todo-gate", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("k");
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const tx = req.result.transaction("k", mode), r = fn(tx.objectStore("k"));
      tx.oncomplete = () => resolve(r && r.result); tx.onerror = () => reject(tx.error);
    };
  });
}
async function deriveKey(user, pass) {
  const te = new TextEncoder(), salt = b64(ENC.salt), extra = te.encode("|" + user.trim().toLowerCase());
  const full = new Uint8Array(salt.length + extra.length); full.set(salt); full.set(extra, salt.length);
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: full, iterations: ENC.iter},
                                 base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
}
async function openWith(key) {
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv), additionalData: new TextEncoder().encode("todo-v1")},
                                            key, b64(ENC.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function unlocked(data) {
  D = data; document.body.classList.remove("locked"); $("#gate").hidden = true; render();
}
async function gate() {
  document.body.classList.add("web", "locked");
  try {                                     // a key kept on this device from an earlier sign-in
    const saved = await idb("readonly", s => s.get("key"));
    if (saved && saved.salt === ENC.salt) return unlocked(await openWith(saved.key));
  } catch (e) { /* none, or made with an old password */ }
  $("#gate").hidden = false; $("#gate-user").focus();
  $("#gate-form").addEventListener("submit", async e => {
    e.preventDefault();
    const go = $("#gate-go"), err = $("#gate-err");
    go.disabled = true; go.textContent = "Unlocking..."; err.textContent = "";
    try {
      const key = await deriveKey($("#gate-user").value, $("#gate-pass").value);
      const data = await openWith(key);
      if ($("#gate-keep").checked) { try { await idb("readwrite", s => s.put({key, salt: ENC.salt}, "key")); } catch (x) {} }
      $("#gate-pass").value = "";
      unlocked(data);
    } catch (x) {
      err.textContent = window.crypto && crypto.subtle ? "Wrong username or password." : "This browser cannot open the page (no WebCrypto).";
      $("#gate-pass").select();
    } finally { go.disabled = false; go.textContent = "Unlock"; }
  });
}
$("#signout").addEventListener("click", async () => {
  try { await idb("readwrite", s => s.delete("key")); } catch (e) {}
  location.reload();
});
if (ENC) gate(); else render();
</script>
