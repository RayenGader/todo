<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Job Hunt</title>
<style>
:root{color-scheme:light dark;--bg:#f4f5f8;--surface:#fff;--text:#12151c;--muted:#5d6676;--line:#e3e6ee;--accent:#3b5bdb;--accent-ink:#fff;--bad:#c2372f}
@media(prefers-color-scheme:dark){:root{--bg:#0d1017;--surface:#151a24;--text:#e9ecf3;--muted:#98a2b5;--line:#252c3b;--accent:#5b7cf5;--accent-ink:#fff;--bad:#ef6b62}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);
  font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
form{width:100%;max-width:380px;padding:30px 26px 24px;border-radius:20px;border:1px solid var(--line);background:var(--surface)}
.logo{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);margin-bottom:16px}
.logo svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
p{margin:6px 0 20px;color:var(--muted);font-size:14px}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label.f input{display:block;width:100%;margin-top:5px;padding:11px 12px;font:inherit;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:11px}
label.f input:focus{outline:2px solid var(--accent);outline-offset:1px}
label.k{display:flex;align-items:center;gap:9px;margin:4px 0 18px;font-size:14px;color:var(--muted);cursor:pointer}
label.k input{width:17px;height:17px;accent-color:var(--accent)}
button{width:100%;padding:12px;font:inherit;font-size:15px;font-weight:600;border:0;border-radius:12px;cursor:pointer;
  background:var(--accent);color:var(--accent-ink)}
button[disabled]{opacity:.7;cursor:wait}
#err{min-height:20px;margin:12px 0 0;font-size:13.5px;color:var(--bad);text-align:center}
.foot{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#wait{color:var(--muted);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="wait">Opening…</div>

  <h1>Job Hunt</h1>
  <p>Private page. Sign in to open your board.</p>
  <label class="f">Username

  <label class="f">Password
    <input id="pass" name="password" type="password" autocomplete="current-password" required></label>
  <label class="k"><input id="keep" type="checkbox"> Stay signed in on this device <span>(not on a shared or work computer)</span></label>
  <button id="go" type="submit">Unlock</button>
  <div id="err" role="alert"></div>
  <div class="foot">The board is encrypted. It opens in your browser, only with your username and password. This is a
    read-only copy from your PC, as of <span id="when"></span>.</div>
</form>

const $ = (s) => document.querySelector(s);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
function idb(mode, fn) {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("todo-gate", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("k");
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const tx = req.result.transaction("k", mode), r = fn(tx.objectStore("k"));
      tx.oncomplete = () => resolve(r && r.result); tx.onerror = () => reject(tx.error);
    };
  });
}
async function deriveKey(user, pass) {
  const te = new TextEncoder(), salt = b64(ENC.salt), extra = te.encode("|" + user.trim().toLowerCase());
  const full = new Uint8Array(salt.length + extra.length); full.set(salt); full.set(extra, salt.length);
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", hash: "SHA-256", salt: full, iterations: ENC.iter},
                                 base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
}
async function openWith(key) {
  const packed = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(ENC.iv), additionalData: new TextEncoder().encode(ENC.aad)},
                                             key, b64(ENC.ct));
  if (!("DecompressionStream" in window)) throw new Error("old-browser");
  const stream = new Blob([packed]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}
function show(page) {                     // the decrypted board takes the place of this page
  document.open(); document.write(page); document.close();
}
async function start() {
  $("#when").textContent = ENC.when || "";
  try {                                   // a key kept on this device from an earlier sign-in
    const saved = await idb("readonly", (s) => s.get("key"));
    if (saved && saved.salt === ENC.salt) return show(await openWith(saved.key));
  } catch (e) { /* none, or made with an older password */ }
  $("#wait").hidden = true; $("#gate").hidden = false; $("#user").focus();
  $("#gate").addEventListener("submit", async (e) => {
    e.preventDefault();
    const go = $("#go"), err = $("#err");
    go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
    try {
      const key = await deriveKey($("#user").value, $("#pass").value);
      const page = await openWith(key);
      if ($("#keep").checked) { try { await idb("readwrite", (s) => s.put({key, salt: ENC.salt}, "key")); } catch (x) {} }
      $("#pass").value = "";
      show(page);
    } catch (x) {
      err.textContent = !(window.crypto && crypto.subtle) ? "This browser cannot open the page (no WebCrypto)."
        : x && x.message === "old-browser" ? "This browser is too old to open the page. Update it, or use Chrome, Edge, Firefox or Safari."
        : "Wrong username or password.";
      $("#pass").select();
    } finally { go.disabled = false; go.textContent = "Unlock"; }
  });
}
start();
})();
